<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090e0b" />
    <title>Nature Camera</title>

      

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />



    <link rel="stylesheet" href="/src/styles/reset.css" />
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components/camera.css" />
    <link rel="stylesheet" href="/src/styles/components/toast.css" />
    <link rel="stylesheet" href="/src/styles/components/gallery.css" />
  </head>
  <body>
    <div id="app">
      <!-- Toast Notice -->
      <div id="toast" class="toast-notice" role="status" aria-live="polite">
        <span id="toast-icon">🌱</span>
        <span id="toast-msg">Saved to Journal</span>
      </div>

      <!-- CAMERA VIEW -->
      <main id="camera-view" class="camera-container">
        <header id="camera-hud" class="camera-hud">
          <span class="camera-tag">Nature Observer</span>
          <div class="hud-actions">
            <button id="btn-frame" class="btn-pill" aria-label="Camera Frame">Raw</button>
            <button id="btn-aspect" class="btn-pill" aria-label="Aspect Ratio">4:3</button>
            <button id="btn-grid-toggle" class="btn-icon" aria-label="Toggle Grid">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
              </svg>
            </button>
          </div>
        </header>

        <div class="viewfinder">
          <div id="viewfinder-frame" class="viewfinder-frame aspect-4-3 frame-none">
            <video id="camera-video" autoplay playsinline muted aria-label="Live Camera Viewfinder"></video>

            <div id="camera-grid" class="camera-grid hidden">
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
              <div class="grid-cell"></div>
            </div>

            <img id="preview-image" class="hidden" alt="Captured nature observation" />
          </div>
        </div>

        <footer class="camera-controls">
          <nav id="filter-carousel" class="filter-carousel" aria-label="Color Profiles"></nav>

          <!-- Standard Capture Toolbar -->
          <div id="capture-bar" class="capture-row">
            <button id="btn-open-journal" class="btn-icon" aria-label="Open Nature Journal">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M3 9h18M9 21V9" />
              </svg>
            </button>

            <button id="btn-capture" class="btn-shutter" aria-label="Capture photograph">
              <span class="shutter-inner"></span>
            </button>

            <button id="btn-flip" class="btn-icon btn-flip" aria-label="Switch Camera Lens">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M21 21v-5h-5" />
              </svg>
            </button>
          </div>

          <!-- Smart Review & Categorization Panel -->
          <div id="review-panel" class="review-panel hidden">
            <!-- Category Selector Ribbon -->
            <div id="review-categories" class="review-categories" aria-label="Select Category"></div>

            <!-- Optional Field Note -->
            <div class="caption-input-wrap">
              <input
                type="text"
                id="input-caption"
                class="caption-input"
                placeholder="Add a field note... (optional)"
                maxlength="100"
                autocomplete="off"
              />
            </div>

            <!-- Actions -->
            <div class="review-actions">
              <button id="btn-retake" class="btn-action">Retake</button>
              <button id="btn-save" class="btn-action btn-action-primary">Keep</button>
            </div>
          </div>
        </footer>

        <section id="error-screen" class="camera-error hidden">
          <h2>Lens Access Required</h2>
          <p id="error-message">Nature Camera requires hardware access.</p>
          <button id="btn-retry" class="btn-action btn-action-primary">Try Again</button>
        </section>
      </main>

      <!-- JOURNAL GALLERY VIEW -->
      <section id="journal-view" class="journal-view hidden">
        <header class="journal-header">
          <h1>Field Journal</h1>
          <button id="btn-close-journal" class="btn-pill" aria-label="Close Journal">Done</button>
        </header>

        <nav id="journal-categories" class="category-filter-bar"></nav>

        <main class="journal-content">
          <div id="observations-grid" class="observations-grid"></div>
          <div id="empty-journal-msg" class="empty-journal hidden">
            <span>🍂</span>
            <p>Your journal is quiet.<br />Step outside and observe something living.</p>
          </div>
        </main>
      </section>

      <!-- OBSERVATION DETAIL INSPECTOR -->
      <section id="detail-modal" class="detail-modal hidden">
        <header class="detail-header">
          <span id="detail-date" class="obs-meta-time"></span>
          <button id="btn-close-detail" class="btn-pill">Close</button>
        </header>

        <div class="detail-body">
          <img id="detail-image" alt="Full view nature observation" />
        </div>

        <footer class="detail-footer">
          <div class="detail-info">
            <span id="detail-category-label" class="detail-title">Observation</span>
            <span id="detail-specs" class="detail-sub"></span>
            <p id="detail-caption" class="detail-caption hidden"></p>
          </div>
          <button id="btn-delete-entry" class="btn-delete">Delete</button>
        </footer>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
